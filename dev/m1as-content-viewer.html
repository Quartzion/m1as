<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>m1as media Browser</title>

    <!-- styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        #assetList {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .asset-card {
            border: 1px solid #ccc;
            padding: 12px;
            width: 250px;
            cursor: pointer;
        }

        .asset-card:hover {
            background: #f5f5f5;
        }

        video {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>m1as Streaming Test</h1>

    <button id="loadAssets">
        Load Public Assets
    </button>

    <div id="ttlStatus"></div>
    <div id="viewer"></div>
    <div id="assetList"></div>

    <script>
        const API_BASE = window.location.origin;
        const assetList = document.getElementById("assetList");
        const viewer = document.getElementById("viewer");
        const ttlStatus =
            document.getElementById("ttlStatus");

        let countdownInterval;

        console.log("API_BASE =", API_BASE);

        document
            .getElementById("loadAssets")
            .addEventListener("click", loadAssets);

        async function loadAssets() {

            assetList.innerHTML = "Loading...";

            const response = await fetch(
                `${API_BASE}/assets/public`
            );

            const assets = await response.json();

            assetList.innerHTML = "";

            assets.forEach(asset => {

                const card = document.createElement("div");

                card.className = "asset-card";

                const previewButton =
                    asset.capabilities?.canPreview
                        ? `
                        <button class="preview-btn">
                        Preview
                        </button>
                         `
                        : "";

                const streamButton =
                    asset.capabilities?.canStream
                        ? `
                        <button class="stream-btn">
                        Stream
                        </button>
                        `
                        : "";


                card.innerHTML = `
                    <strong>${asset.displayName}</strong>
                    <br>
                    ${asset.mimeType}
                    <br>
                    ${(asset.size / 1024 / 1024).toFixed(2)} MB
                    <br>

                    Capabilities:
                    <br>
                    Stream: ${asset.capabilities?.canStream ? "Available" : "Unavailable"}
                    <br>
                    Preview: ${asset.capabilities?.canPreview ? "Available" : "Unavailable"}
                    <br>
                    Mode: ${asset.capabilities?.previewMode ?? "none"}
                    <br>
                    Download:
                    ${asset.capabilities?.canDownload ? "Available" : "Unavailable"}
                    <br><br>

                    ${previewButton}
                    ${streamButton}
                `;

                const streamBtn = card.querySelector(".stream-btn");

                if (streamBtn) {
                    streamBtn.addEventListener("click",
                        () => loadAsset(asset)
                    );
                }


                const previewBtn =
                    card.querySelector(".preview-btn");

                if (previewBtn) {
                    previewBtn.addEventListener(
                        "click",
                        () => loadPreview(asset)
                    );
                }

                assetList.appendChild(card);
            });
        }


        // LOAD PREVIEWS (Secure Header Authenticated Sandbox via srcdoc)
        async function loadPreview(asset) {
            viewer.innerHTML = "Loading Preview...";

            // 1. Fetch via standard network channels where custom headers work perfectly
            const response = await fetch(
                `${API_BASE}/assets/${asset.id}/preview`,
                {
                    headers: {
                        "m1as-user-id": "dev-user" // 👈 Clears your global middleware requirements
                    }
                }
            );

            if (!response.ok) {
                viewer.innerHTML = `<pre>${await response.text()}</pre>`;
                return;
            }

            const cleanHtmlPayload = await response.text();

            // 2. Instantiate a clean structural layout frame container
            const iframe = document.createElement("iframe");
            
            // Enforce browser-level execution context rules
            iframe.sandbox = "allow-scripts"; 
            iframe.style.width = "100%";
            iframe.style.height = "75vh";
            iframe.style.border = "1px solid #ccc";
            iframe.style.marginTop = "20px";
            
            // 3. Inject the safe translated HTML code block directly into the iframe target context
            iframe.srcdoc = cleanHtmlPayload;

            // Paint the isolated sandbox layout to screen
            viewer.innerHTML = "";
            viewer.appendChild(iframe);
        }




        // LOAD ASSETS
        async function loadAsset(asset) {

            const response = await fetch(
                `${API_BASE}/assets/${asset.id}/signed`
            );

            const signed = await response.json();

            startCountdown(
                signed.expires,
                signed.ttl
            );
            const signedUrl =
                `${API_BASE}${signed.url}`;

            viewer.innerHTML = "";

            // Video
            if (asset.mimeType.startsWith("video/")) {

                const video =
                    document.createElement("video");

                video.controls = true;
                video.width = 800;
                video.preload = "metadata";
                video.src = signedUrl;

                viewer.appendChild(video);

                return;
            }

            // Image
            if (asset.mimeType.startsWith("image/")) {

                const img =
                    document.createElement("img");

                img.src = signedUrl;
                img.style.maxWidth = "800px";

                viewer.appendChild(img);

                return;
            }

            // Audio
            if (asset.mimeType.startsWith("audio/")) {

                const audio =
                    document.createElement("audio");

                audio.controls = true;
                audio.src = signedUrl;

                viewer.appendChild(audio);

                return;
            }

            // PDF
            if (asset.mimeType === "application/pdf") {

                const iframe =
                    document.createElement("iframe");

                iframe.src = signedUrl;
                iframe.width = "800";
                iframe.height = "1000";

                viewer.appendChild(iframe);

                return;
            }

            // Fallback
            const link =
                document.createElement("a");

            link.href = signedUrl;
            link.textContent =
                "Click to stream text asset";

            link.target = "_blank";

            viewer.appendChild(link);
        }

        function startCountdown(expires, ttl) {

            clearInterval(countdownInterval);

            function update() {

                const now =
                    Math.floor(Date.now() / 1000);

                const remaining =
                    expires - now;

                if (remaining <= 0) {

                    ttlStatus.innerHTML = `
                <strong>
                    Signed URL Expired
                </strong>
                <br>
                Click "Load Public Assets"
                to refresh.
            `;

                    clearInterval(
                        countdownInterval
                    );

                    return;
                }

                const minutes =
                    Math.floor(remaining / 60);

                const seconds =
                    remaining % 60;

                ttlStatus.innerHTML = `
            TTL: ${ttl}s
            <br>
            Expires In:
            ${minutes}:${String(seconds)
                        .padStart(2, "0")}
        `;
            }

            update();

            countdownInterval =
                setInterval(update, 1000);
        }

    </script>

</body>

</html>
